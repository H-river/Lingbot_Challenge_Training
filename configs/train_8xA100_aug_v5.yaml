  lr_decay_style: cosine
  optimizer: muon
  num_train_epochs: 29000
  micro_batch_size: 4
  global_batch_size: 1024
  gradient_accumulation_steps: 32
  max_steps: 3000
  ckpt_manager: dcp
  save_steps: 1000
  save_epochs: 0
  enable_fp32: true
  enable_resume: false
  align_params:
    mode: query
    num_task_tokens: 8
    depth_loss_weight: 0.004
    future_depth_loss_weight: 0.004
    use_future_video: true
    llm:
      dim_out: 2560
      image_token_size: 8
      image_input_size: 224
    depth:
      model_type: MoRGBD
      moge_path: /root/lingbot_challenge/models/MoGe-2-vitb-normal/model.pt
      morgbd_path: /REQUIRES_VERIFIED_8K_EXPORT/depth/model.pt
      num_layers: 1
      num_heads: 4
      dim_head: 32
      ff_mult: 1
      num_backbone_tokens: 256
      token_size: 16
      dim_out: 1024
      input_size: 224
      use_future_depth: true
      block_future_depth_to_action: false
      detach_future_image_feats: true
    video:
